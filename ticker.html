<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      position: relative;
    }

    .ticker {
      position: absolute;
      bottom: 0;
      left: 0;

      width: 100%;
      height: 70px;

      display: flex;
      align-items: center;

      overflow: hidden;
      white-space: nowrap;

      background: #020c08;
      box-sizing: border-box;
    }

    .ticker-text {
      display: inline-block;
      flex-shrink: 0;
      padding-left: 100%;

      font-family: "Henny Penny", fantasy;
      font-size: 34px;
      letter-spacing: 2px;

      color: #d6b94c;

      text-shadow:
        2px 2px 2px #000,
        0 0 5px rgba(214, 185, 76, 0.25);

      animation: scroll 22s linear infinite;
    }

    @keyframes scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-100%);
      }
    }
  </style>
</head>

<body>

  <div class="ticker">
    <div class="ticker-text">
      ⚡ THE GRADEBOOK CLOSES FRIDAY! ⚡
      &nbsp;&nbsp; ✦ CHECK SKYWARD ✦ &nbsp;&nbsp;
      GET ANY MISSING WORK TURNED IN ASAP!
      &nbsp;&nbsp; ✦ DON'T WAIT UNTIL THE LAST MINUTE! ✦
    </div>
  </div>

</body>
</html>
