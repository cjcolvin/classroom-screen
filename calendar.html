<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================
   COMPLETE CALENDAR
   ========================================= */

.calendar {
    position: relative;

    width: min(100vw, calc(100vh * 3));
    aspect-ratio: 3 / 1;

    background-image: url("./flipcalander.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
}


/* =========================================
   COMMON TEXT
   ========================================= */

.date-text {
    position: absolute;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Impact, "Arial Black", sans-serif;
    font-weight: 900;

    text-align: center;
}


/* =========================================
   DAY TILE
   ========================================= */

.day {
    left: 3%;
    top: 22%;

    width: 21%;
    height: 68%;

    color: #eee9dc;

    writing-mode: vertical-rl;
    text-orientation: upright;

    letter-spacing: .02em;
}


/* =========================================
   FIRST NUMBER
   ========================================= */

.tens {
    left: 27%;
    top: 20%;

    width: 22%;
    height: 70%;

    color: #151515;
}


/* =========================================
   SECOND NUMBER
   ========================================= */

.ones {
    left: 51%;
    top: 20%;

    width: 22%;
    height: 70%;

    color: #151515;
}


/* =========================================
   MONTH TILE
   ========================================= */

.month {
    left: 76%;
    top: 22%;

    width: 21%;
    height: 68%;

    color: #eee9dc;

    writing-mode: vertical-rl;
    text-orientation: upright;

    letter-spacing: .02em;
}

</style>
</head>


<body>

<div class="calendar" id="calendar">

    <div
        class="date-text day"
        id="day">
    </div>

    <div
        class="date-text tens"
        id="tens">
    </div>

    <div
        class="date-text ones"
        id="ones">
    </div>

    <div
        class="date-text month"
        id="month">
    </div>

</div>


<script>

const DAYS = [
    "SUN",
    "MON",
    "TUE",
    "WED",
    "THUR",
    "FRI",
    "SAT"
];

const MONTHS = [
    "JAN",
    "FEB",
    "MAR",
    "APR",
    "MAY",
    "JUN",
    "JUL",
    "AUG",
    "SEP",
    "OCT",
    "NOV",
    "DEC"
];


const calendar =
    document.getElementById("calendar");

const day =
    document.getElementById("day");

const tens =
    document.getElementById("tens");

const ones =
    document.getElementById("ones");

const month =
    document.getElementById("month");


function updateDate() {

    const today = new Date();

    const date =
        String(today.getDate())
        .padStart(2, "0");

    day.textContent =
        DAYS[today.getDay()];

    tens.textContent =
        date[0];

    ones.textContent =
        date[1];

    month.textContent =
        MONTHS[today.getMonth()];

    resizeText();
}


function resizeText() {

    /*
    Everything is based on the actual
    rendered CALENDAR width.
    */

    const w =
        calendar.getBoundingClientRect().width;


    /* Giant numbers */

    const numberSize =
        w * 0.155;

    tens.style.fontSize =
        numberSize + "px";

    ones.style.fontSize =
        numberSize + "px";


    /* Day + month */

    const wordSize =
        w * 0.050;

    day.style.fontSize =
        wordSize + "px";

    month.style.fontSize =
        wordSize + "px";
}


/* Watch Classroomscreen resizing */

const observer =
    new ResizeObserver(resizeText);

observer.observe(calendar);


/* Start */

updateDate();


/* Keep date current */

setInterval(
    updateDate,
    60000
);

</script>

</body>
</html>
