<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ENTIRE CALENDAR */

.calendar {
    position: relative;

    /* Same proportions as our artwork */
    width: min(100vw, calc(100vh * 3));
    aspect-ratio: 3 / 1;

    background-image: url("./flipcalander.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}


/* COMMON TEXT */

.date-text {
    position: absolute;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Impact, "Arial Black", sans-serif;
    font-weight: 900;

    text-align: center;
}


/* DAY TILE */

.day {
    left: 3%;
    top: 18%;
    width: 21%;
    height: 72%;

    flex-direction: column;

    color: #eee9dc;

    font-size: clamp(22px, 5vw, 90px);
    line-height: 1;
}


/* FIRST NUMBER */

.tens {
    left: 27%;
    top: 17%;
    width: 22%;
    height: 74%;

    color: #151515;

    font-size: clamp(80px, 18vw, 310px);
    line-height: 1;
}


/* SECOND NUMBER */

.ones {
    left: 51%;
    top: 17%;
    width: 22%;
    height: 74%;

    color: #151515;

    font-size: clamp(80px, 18vw, 310px);
    line-height: 1;
}


/* MONTH TILE */

.month {
    left: 76%;
    top: 18%;
    width: 21%;
    height: 72%;

    flex-direction: column;

    color: #eee9dc;

    font-size: clamp(22px, 5vw, 90px);
    line-height: 1;
}


/* LETTER STACKING */

.vertical span {
    display: block;
}

</style>
</head>


<body>

<div class="calendar">

    <div
        class="date-text day vertical"
        id="day">
    </div>

    <div
        class="date-text tens"
        id="tens">
    </div>

    <div
        class="date-text ones"
        id="ones">
    </div>

    <div
        class="date-text month vertical"
        id="month">
    </div>

</div>


<script>

const DAYS = [
    "SUN",
    "MON",
    "TUE",
    "WED",
    "THUR",
    "FRI",
    "SAT"
];

const MONTHS = [
    "JAN",
    "FEB",
    "MAR",
    "APR",
    "MAY",
    "JUN",
    "JUL",
    "AUG",
    "SEP",
    "OCT",
    "NOV",
    "DEC"
];


function stackLetters(word) {

    return word
        .split("")
        .map(letter => "<span>" + letter + "</span>")
        .join("");
}


function updateCalendar() {

    const today = new Date();

    const day =
        DAYS[today.getDay()];

    const month =
        MONTHS[today.getMonth()];

    const date =
        String(today.getDate())
        .padStart(2, "0");


    document.getElementById("day").innerHTML =
        stackLetters(day);

    document.getElementById("tens").textContent =
        date[0];

    document.getElementById("ones").textContent =
        date[1];

    document.getElementById("month").innerHTML =
        stackLetters(month);
}


/* Set date when page opens */

updateCalendar();


/* Check periodically in case page stays open overnight */

setInterval(
    updateCalendar,
    60000
);

</script>

</body>
</html>
