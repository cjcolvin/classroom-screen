<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial Black, Impact, sans-serif;
}

/* WHOLE CALENDAR — KEEPS ITS PROPORTIONS */

.calendar {
    width: min(98vw, calc(98vh * 2.75));
    aspect-ratio: 2.75 / 1;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    gap: 1.2%;

    padding-top: 7%;
}


/* TILE */

.tile {
    position: relative;

    height: 88%;

    border-radius: 5%;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 6px 8px rgba(0,0,0,.35);

    transform-origin: top center;

    overflow: visible;
}


/* DARK DAY + MONTH TILES */

.dark {
    width: 20%;

    background:
        linear-gradient(
            100deg,
            #292826,
            #151515 35%,
            #242321 100%
        );

    border: clamp(3px, .5vw, 8px) solid #81543b;

    color: #f0ede4;

    box-shadow:
        inset 0 0 18px rgba(0,0,0,.8),
        0 6px 8px rgba(0,0,0,.35);
}


/* CREAM NUMBER TILES */

.light {
    width: 27%;

    background:
        linear-gradient(
            105deg,
            #eee9dc,
            #fffdf4 45%,
            #e9e3d6 100%
        );

    border: clamp(3px, .5vw, 8px) solid #9a684a;

    color: #111;

    box-shadow:
        inset 0 0 14px rgba(107,72,46,.18),
        0 6px 8px rgba(0,0,0,.35);
}


/* DISTRESSED INNER EDGE */

.tile::after {
    content: "";

    position: absolute;
    inset: 1.5%;

    border-radius: 4%;

    border: 1px solid rgba(91,52,31,.35);

    pointer-events: none;
}


/* TWO RINGS PER TILE */

.ring {
    position: absolute;

    top: -18%;

    width: 8%;
    height: 31%;

    border: clamp(5px, .65vw, 11px) solid #191919;

    border-bottom: none;

    border-radius: 50% 50% 0 0;

    z-index: 5;

    box-shadow:
        inset 2px 0 2px rgba(255,255,255,.13),
        2px 2px 3px rgba(0,0,0,.5);
}

.ring.left {
    left: 20%;
}

.ring.right {
    right: 20%;
}


/* NUMBER TEXT */

.number-text {
    font-family: Impact, "Arial Black", sans-serif;

    font-size: clamp(70px, 17vw, 280px);

    font-weight: 900;

    line-height: .8;

    transform: scaleX(.9);
}


/* VERTICAL WORDS */

.vertical-text {
    height: 76%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: space-evenly;

    font-family: "Arial Black", Impact, sans-serif;

    font-size: clamp(18px, 3.6vw, 62px);

    font-weight: 900;

    line-height: 1;
}


/* FLIP ANIMATION */

.flip {
    animation: flipCard .65s ease;
}

@keyframes flipCard {

    0% {
        transform: rotateX(0deg);
    }

    45% {
        transform: rotateX(-82deg);
    }

    55% {
        transform: rotateX(-82deg);
    }

    100% {
        transform: rotateX(0deg);
    }
}


/* SLIGHT IMPERFECTION LIKE REAL CARDS */

.tile:nth-child(1) {
    transform: rotate(-1deg);
}

.tile:nth-child(2) {
    transform: rotate(.5deg);
}

.tile:nth-child(3) {
    transform: rotate(-.4deg);
}

.tile:nth-child(4) {
    transform: rotate(.8deg);
}

</style>
</head>


<body>

<div class="calendar">

    <!-- DAY -->

    <div class="tile dark" id="dayTile">

        <span class="ring left"></span>
        <span class="ring right"></span>

        <div
            class="vertical-text"
            id="day">
        </div>

    </div>


    <!-- FIRST NUMBER -->

    <div class="tile light" id="tensTile">

        <span class="ring left"></span>
        <span class="ring right"></span>

        <div
            class="number-text"
            id="tens">
        </div>

    </div>


    <!-- SECOND NUMBER -->

    <div class="tile light" id="onesTile">

        <span class="ring left"></span>
        <span class="ring right"></span>

        <div
            class="number-text"
            id="ones">
        </div>

    </div>


    <!-- MONTH -->

    <div class="tile dark" id="monthTile">

        <span class="ring left"></span>
        <span class="ring right"></span>

        <div
            class="vertical-text"
            id="month">
        </div>

    </div>

</div>


<script>

const DAYS = [
    "SUN",
    "MON",
    "TUE",
    "WED",
    "THUR",
    "FRI",
    "SAT"
];

const MONTHS = [
    "JAN",
    "FEB",
    "MAR",
    "APR",
    "MAY",
    "JUN",
    "JUL",
    "AUG",
    "SEP",
    "OCT",
    "NOV",
    "DEC"
];


let previous = {};


/* PUT EACH LETTER ON ITS OWN LINE */

function verticalLetters(word) {

    return word
        .split("")
        .map(letter => `<span>${letter}</span>`)
        .join("");
}


/* FLIP A TILE IF ITS VALUE CHANGED */

function updateTile(tile, element, value, vertical = false) {

    if (previous[element.id] === value) {
        return;
    }

    tile.classList.remove("flip");

    void tile.offsetWidth;

    tile.classList.add("flip");

    setTimeout(() => {

        if (vertical) {
            element.innerHTML =
                verticalLetters(value);
        } else {
            element.textContent =
                value;
        }

    }, 290);


    previous[element.id] = value;
}


/* UPDATE DATE */

function updateCalendar() {

    const now = new Date();

    const day =
        DAYS[now.getDay()];

    const month =
        MONTHS[now.getMonth()];

    const date =
        String(now.getDate())
        .padStart(2, "0");


    updateTile(
        document.getElementById("dayTile"),
        document.getElementById("day"),
        day,
        true
    );


    updateTile(
        document.getElementById("tensTile"),
        document.getElementById("tens"),
        date[0]
    );


    updateTile(
        document.getElementById("onesTile"),
        document.getElementById("ones"),
        date[1]
    );


    updateTile(
        document.getElementById("monthTile"),
        document.getElementById("month"),
        month,
        true
    );
}


/* FIRST LOAD */

updateCalendar();


/* CHECK ONCE A MINUTE */

setInterval(
    updateCalendar,
    60000
);

</script>

</body>
</html>
