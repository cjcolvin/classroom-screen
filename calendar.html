<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Henny Penny", fantasy;
}

/* WHOLE CALENDAR */

.calendar {
    width: min(96vw, calc(96vh * 2.4));
    aspect-ratio: 2.4 / 1;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2%;

    padding: 7% 5% 11%;

    border-radius: 4%;

    background:
        linear-gradient(
            180deg,
            #171717 0%,
            #080808 70%,
            #020202 100%
        );

    border: 3px solid #8c6925;

    box-shadow:
        0 8px 18px rgba(0,0,0,.65),
        inset 0 0 12px rgba(214,185,76,.18);
}

/* GOLD BASE */

.calendar::after {
    content: "";
    position: absolute;

    left: 2%;
    right: 2%;
    bottom: 3%;

    height: 8%;

    border-radius: 50%;

    background:
        linear-gradient(
            180deg,
            #d7ba55,
            #8a651d 50%,
            #4e350d
        );

    box-shadow:
        0 5px 10px rgba(0,0,0,.55);
}


/* INDIVIDUAL FLIP CARDS */

.card {
    position: relative;

    height: 80%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            #10294b,
            #061426 70%
        );

    border: 4px solid #a77d29;

    border-radius: 5%;

    box-shadow:
        inset 0 0 18px rgba(0,0,0,.85),
        0 5px 10px rgba(0,0,0,.6);

    color: #e0c15a;

    text-shadow:
        2px 2px 3px #000,
        0 0 5px rgba(224,193,90,.35);
}


/* DAY CARD */

.day {
    width: 25%;
    padding: 4%;

    font-size: clamp(18px, 4vw, 65px);

    writing-mode: vertical-rl;
    transform: rotate(180deg);

    letter-spacing: .12em;
}


/* NUMBER CARDS */

.number {
    width: 20%;

    font-family: Georgia, serif;
    font-weight: bold;

    font-size: clamp(60px, 12vw, 190px);

    line-height: 1;
}


/* MONTH CARD */

.month {
    width: 25%;
    padding: 4%;

    font-size: clamp(18px, 4vw, 65px);

    writing-mode: vertical-rl;

    letter-spacing: .1em;
}


/* BINDER RINGS */

.ring {
    position: absolute;

    top: -13%;

    width: 18%;
    height: 28%;

    border: clamp(4px, .7vw, 10px) solid #151515;

    border-bottom: none;

    border-radius: 50% 50% 0 0;

    z-index: 5;

    box-shadow:
        inset 2px 0 2px rgba(255,255,255,.15),
        2px 2px 3px rgba(0,0,0,.8);
}

.ring.left {
    left: 16%;
}

.ring.right {
    right: 16%;
}


/* LITTLE GOLD DIVIDER ACROSS EACH CARD */

.card::after {
    content: "";

    position: absolute;

    left: 8%;
    right: 8%;
    top: 50%;

    height: 1px;

    background: rgba(214,185,76,.28);
}


/* DECORATIVE GOLD STARS */

.star {
    position: absolute;

    color: #d6b94c;

    font-size: clamp(12px, 1.8vw, 28px);

    z-index: 10;
}

.star.left {
    left: 2.5%;
    bottom: 5%;
}

.star.right {
    right: 2.5%;
    bottom: 5%;
}

</style>
</head>


<body>

<div class="calendar">

    <div class="card day">
        <span class="ring left"></span>
        <span class="ring right"></span>
        <span id="day">WED</span>
    </div>


    <div class="card number">
        <span class="ring left"></span>
        <span class="ring right"></span>
        <span id="tens">0</span>
    </div>


    <div class="card number">
        <span class="ring left"></span>
        <span class="ring right"></span>
        <span id="ones">7</span>
    </div>


    <div class="card month">
        <span class="ring left"></span>
        <span class="ring right"></span>
        <span id="month">OCT</span>
    </div>


    <span class="star left">✦</span>
    <span class="star right">✦</span>

</div>


<script>

function updateCalendar() {

    const now = new Date();

    const days = [
        "SUN",
        "MON",
        "TUE",
        "WED",
        "THUR",
        "FRI",
        "SAT"
    ];

    const months = [
        "JAN",
        "FEB",
        "MAR",
        "APR",
        "MAY",
        "JUN",
        "JUL",
        "AUG",
        "SEP",
        "OCT",
        "NOV",
        "DEC"
    ];

    const date =
        String(now.getDate()).padStart(2, "0");

    document.getElementById("day").textContent =
        days[now.getDay()];

    document.getElementById("tens").textContent =
        date[0];

    document.getElementById("ones").textContent =
        date[1];

    document.getElementById("month").textContent =
        months[now.getMonth()];
}


/* SET DATE IMMEDIATELY */

updateCalendar();


/*
Check periodically so if the screen stays open
overnight, the calendar changes automatically.
*/

setInterval(updateCalendar, 60000);

</script>

</body>
</html>
