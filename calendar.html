<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: transparent;

    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =====================================
   CALENDAR
   ===================================== */

.calendar {

    position: relative;

    /*
    Keep the exact proportions of
    the calendar artwork.
    */

    width: min(
        100vw,
        calc(100vh * 3)
    );

    aspect-ratio: 3 / 1;

    background-image:
        url("./flipcalander.png");

    background-repeat: no-repeat;

    background-position: center;

    background-size: 100% 100%;

}


/* =====================================
   DATE TEXT
   ===================================== */

.date-text {

    position: absolute;

    display: flex;

    align-items: center;
    justify-content: center;

    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-weight: 900;

    text-align: center;
}


/* =====================================
   DAY
   ===================================== */

.day {

    left: 3%;

    top: 22%;

    width: 21%;

    height: 68%;

    flex-direction: column;

    color: #eee9dc;
}


/* =====================================
   FIRST NUMBER
   ===================================== */

.tens {

    left: 27%;

    top: 20%;

    width: 22%;

    height: 70%;

    color: #151515;
}


/* =====================================
   SECOND NUMBER
   ===================================== */

.ones {

    left: 51%;

    top: 20%;

    width: 22%;

    height: 70%;

    color: #151515;
}


/* =====================================
   MONTH
   ===================================== */

.month {

    left: 76%;

    top: 22%;

    width: 21%;

    height: 68%;

    flex-direction: column;

    color: #eee9dc;
}


/* =====================================
   LETTERS
   ===================================== */

.vertical span {

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;

    flex: 1;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-weight: 900;

    line-height: .8;

    transform: scaleX(1.35);
}

</style>

</head>


<body>


<div
    class="calendar"
    id="calendar">


    <div
        class="date-text day vertical"
        id="day">
    </div>


    <div
        class="date-text tens"
        id="tens">
    </div>


    <div
        class="date-text ones"
        id="ones">
    </div>


    <div
        class="date-text month vertical"
        id="month">
    </div>


</div>



<script>


const DAYS = [
    "SUN",
    "MON",
    "TUE",
    "WED",
    "THUR",
    "FRI",
    "SAT"
];


const MONTHS = [
    "JAN",
    "FEB",
    "MAR",
    "APR",
    "MAY",
    "JUN",
    "JUL",
    "AUG",
    "SEP",
    "OCT",
    "NOV",
    "DEC"
];



const calendar =
    document.getElementById("calendar");

const dayElement =
    document.getElementById("day");

const monthElement =
    document.getElementById("month");

const tensElement =
    document.getElementById("tens");

const onesElement =
    document.getElementById("ones");



function stackLetters(word) {

    return word
        .split("")
        .map(
            letter =>
            "<span>" +
            letter +
            "</span>"
        )
        .join("");
}



/* =====================================
   RESPONSIVE FONT SIZING

   IMPORTANT:
   Font size is based on the CALENDAR,
   not the Classroomscreen iframe.
   ===================================== */

function resizeText() {

    const width =
        calendar.getBoundingClientRect().width;


    /*
    Number size
    */

    const numberSize =
        width * 0.155;

    tensElement.style.fontSize =
        numberSize + "px";

    onesElement.style.fontSize =
        numberSize + "px";


    /*
    Day/month letter size
    */

    const letterSize =
        width * 0.045;

    dayElement.style.fontSize =
        letterSize + "px";

    monthElement.style.fontSize =
        letterSize + "px";
}



/* =====================================
   UPDATE DATE
   ===================================== */

function updateCalendar() {

    const today =
        new Date();


    const day =
        DAYS[
            today.getDay()
        ];


    const month =
        MONTHS[
            today.getMonth()
        ];


    const date =
        String(
            today.getDate()
        )
        .padStart(
            2,
            "0"
        );


    dayElement.innerHTML =
        stackLetters(day);


    tensElement.textContent =
        date[0];


    onesElement.textContent =
        date[1];


    monthElement.innerHTML =
        stackLetters(month);


    resizeText();
}



/* =====================================
   WATCH FOR CLASSROOMSCREEN RESIZING
   ===================================== */

const observer =
    new ResizeObserver(
        resizeText
    );

observer.observe(
    calendar
);



/* =====================================
   START
   ===================================== */

updateCalendar();


setInterval(
    updateCalendar,
    60000
);


</script>


</body>

</html>
