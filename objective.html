<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ORNATE FRAME */

.frame {
    position: relative;
    width: 100%;
    height: 100%;

    background-image: url("./Objectiveframe.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}


/* EDITABLE WRITING AREA */

.objective-text {
    position: absolute;

    /* Keeps typing inside the open navy portion */
    left: 13%;
    right: 13%;
    top: 35%;
    bottom: 15%;

    box-sizing: border-box;
    padding: 10px 20px;

    font-family: "Henny Penny", fantasy;
    font-size: clamp(22px, 3.2vw, 48px);
    line-height: 1.45;
    letter-spacing: 1px;

    color: #e4c35a;

    text-align: center;

    text-shadow:
        2px 2px 3px #000000,
        0 0 6px rgba(228,195,90,0.35);

    outline: none;
    cursor: text;

    overflow: hidden;

    /* IMPORTANT: preserves your line breaks */
    white-space: pre-wrap;
    overflow-wrap: break-word;
}

.objective-text:focus {
    background: rgba(255,255,255,0.02);
}

</style>
</head>

<body>

<div class="frame">

    <div
        id="objective"
        class="objective-text"
        contenteditable="true"
        spellcheck="true"
    >I can plan and draft an essay
in response to a prompt
using text evidence for support.</div>

</div>


<script>

const objective = document.getElementById("objective");

/* LOAD SAVED OBJECTIVE */

const savedObjective =
    localStorage.getItem("mrsColvinObjective");

if (savedObjective) {
    objective.innerHTML = savedObjective;
}


/* SAVE AS YOU TYPE */

objective.addEventListener("input", function() {

    localStorage.setItem(
        "mrsColvinObjective",
        objective.innerHTML
    );

});

</script>

</body>
</html>
