<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

.frame {
    position: relative;
    width: 100%;
    height: 100%;

    background-image: url("./Objectiveframe.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}

.objective-text {
    position: absolute;

    /* Keep text safely inside the ornate frame */
    left: 19%;
    width: 62%;

    top: 37%;
    height: 40%;

    box-sizing: border-box;
    padding: 8px 12px;

    border: none;
    outline: none;
    resize: none;
    background: transparent;

    font-family: "Henny Penny", fantasy;

    /* JavaScript will automatically adjust this */
    font-size: 48px;

    line-height: 1.35;
    letter-spacing: 1px;

    color: #e4c35a;
    text-align: center;

    text-shadow:
        2px 2px 3px #000000,
        0 0 6px rgba(228,195,90,0.35);

    overflow: hidden;
}

.objective-text:focus {
    background: rgba(255,255,255,0.02);
}

</style>
</head>

<body>

<div class="frame">

<textarea
    id="objective"
    class="objective-text"
    spellcheck="true"
>I can plan and draft an essay in response to a prompt using text evidence for support.</textarea>

</div>

<script>

const objective = document.getElementById("objective");

const savedObjective =
    localStorage.getItem("mrsColvinObjectiveText");

if (savedObjective !== null) {
    objective.value = savedObjective;
}


/* AUTOMATIC FONT SIZING */

function fitObjective() {

    /* Start nice and large */
    let fontSize = 48;

    objective.style.fontSize = fontSize + "px";

    /*
       If the text doesn't fit, shrink it
       one pixel at a time until it does.
    */

    while (
        objective.scrollHeight > objective.clientHeight &&
        fontSize > 22
    ) {
        fontSize--;
        objective.style.fontSize = fontSize + "px";
    }
}


/* SAVE + RESIZE WHEN YOU TYPE */

objective.addEventListener("input", function() {

    localStorage.setItem(
        "mrsColvinObjectiveText",
        objective.value
    );

    fitObjective();

});


/* Resize again if the window/widget changes size */

window.addEventListener("resize", fitObjective);


/* Size correctly when page first opens */

window.addEventListener("load", function() {

    /* Give the Google font a moment to load */
    document.fonts.ready.then(function() {
        fitObjective();
    });

});

</script>

</body>
</html>
