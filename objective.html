<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ORNATE OBJECTIVE FRAME */

.frame {
    position: relative;
    width: 100%;
    height: 100%;

    background-image: url("./Objectiveframe.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}


/* EDITABLE OBJECTIVE BOX */

.objective-text {
    position: absolute;

    /* KEEP THESE DIMENSIONS */
    left: 18%;
    width: 64%;

    top: 34%;
    height: 48%;

    box-sizing: border-box;
    padding: 8px 10px;

    border: none;
    outline: none;
    resize: none;

    background: transparent;

    font-family: "Henny Penny", fantasy;

    /* START LARGE */
    font-size: 120px;

    line-height: 1.18;
    letter-spacing: 1px;

    color: #e4c35a;

    text-align: center;

    text-shadow:
        2px 2px 3px #000000,
        0 0 6px rgba(228,195,90,0.35);

    overflow: hidden;
}


/* HIDDEN COPY USED TO MEASURE TEXT */

.measure {
    position: absolute;

    visibility: hidden;
    pointer-events: none;

    width: 64%;

    box-sizing: border-box;
    padding: 8px 10px;

    font-family: "Henny Penny", fantasy;

    font-size: 120px;

    line-height: 1.18;
    letter-spacing: 1px;

    text-align: center;

    white-space: pre-wrap;
    overflow-wrap: break-word;
}


.objective-text:focus {
    background: rgba(255,255,255,0.02);
}

</style>
</head>


<body>

<div class="frame">

<textarea
    id="objective"
    class="objective-text"
    spellcheck="true"
>I can plan and draft an essay in response to a prompt using text evidence for support.</textarea>

<div
    id="measure"
    class="measure">
</div>

</div>


<script>

const objective =
    document.getElementById("objective");

const measure =
    document.getElementById("measure");


/* LOAD YOUR SAVED OBJECTIVE */

const savedObjective =
    localStorage.getItem("mrsColvinObjectiveText");

if (savedObjective !== null) {
    objective.value = savedObjective;
}


/* AUTOMATIC FONT FITTING */

function fitObjective() {

    /*
    Always try the large size first.
    It will shrink ONLY if the text
    needs more room.
    */

    let size = 120;

    const minimumSize = 24;

    measure.textContent = objective.value;

    while (size > minimumSize) {

        measure.style.fontSize =
            size + "px";

        if (
            measure.scrollHeight <=
            objective.clientHeight
        ) {
            break;
        }

        size--;
    }

    objective.style.fontSize =
        size + "px";
}


/* SAVE + REFIT WHILE YOU TYPE */

objective.addEventListener(
    "input",
    function() {

        localStorage.setItem(
            "mrsColvinObjectiveText",
            objective.value
        );

        fitObjective();
    }
);


/* REFIT IF YOU RESIZE THE WIDGET */

window.addEventListener(
    "resize",
    fitObjective
);


/* FIT WHEN THE PAGE FIRST OPENS */

window.addEventListener(
    "load",
    function() {

        document.fonts.ready.then(
            function() {
                fitObjective();
            }
        );

    }
);

</script>

</body>
</html>
