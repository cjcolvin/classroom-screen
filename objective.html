<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ORNATE FRAME */

.frame {
    position: relative;
    width: 100%;
    height: 100%;

    background-image: url("./Objectiveframe.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}

/* NORMAL EDITABLE TEXT BOX */

.objective-text {
    position: absolute;

    left: 14%;
    width: 72%;

    top: 37%;
    height: 43%;

    box-sizing: border-box;
    padding: 10px 20px;

    border: none;
    outline: none;
    resize: none;

    background: transparent;

    font-family: "Henny Penny", fantasy;
    font-size: clamp(22px, 3.2vw, 48px);
    line-height: 1.45;
    letter-spacing: 1px;

    color: #e4c35a;

    text-align: center;

    text-shadow:
        2px 2px 3px #000000,
        0 0 6px rgba(228,195,90,0.35);

    overflow: hidden;
}

.objective-text:focus {
    background: rgba(255,255,255,0.02);
}

</style>
</head>

<body>

<div class="frame">

<textarea
    id="objective"
    class="objective-text"
    spellcheck="true"
>I can plan and draft an essay
in response to a prompt
using text evidence for support.</textarea>

</div>

<script>

const objective = document.getElementById("objective");

/* LOAD SAVED TEXT */

const savedObjective =
    localStorage.getItem("mrsColvinObjectiveText");

if (savedObjective !== null) {
    objective.value = savedObjective;
}

/* SAVE TEXT AND LINE BREAKS */

objective.addEventListener("input", function() {

    localStorage.setItem(
        "mrsColvinObjectiveText",
        objective.value
    );

});

</script>

</body>
</html>
