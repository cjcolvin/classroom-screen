<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/*
EVERYTHING lives inside this container.
It always keeps the same proportions as
the original frame image.
*/

.frame {
    position: relative;

    width: min(100vw, calc(100vh * 1.7778));
    height: min(100vh, calc(100vw / 1.7778));

    background-image: url("./Objectiveframe.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
}


/* EDITABLE OBJECTIVE */

.objective-text {
    position: absolute;

    /*
    These percentages are now based on
    THE FRAME — not the whole widget.
    */

    left: 18%;
    width: 64%;

    top: 34%;
    height: 48%;

    box-sizing: border-box;

    padding: 1%;

    border: none;
    outline: none;
    resize: none;

    background: transparent;

    font-family: "Henny Penny", fantasy;

    /*
    Responsive starting size.
    This grows/shrinks WITH the frame.
    */
    font-size: clamp(
        24px,
        6.5vw,
        120px
    );

    line-height: 1.18;
    letter-spacing: 0.05em;

    color: #e4c35a;

    text-align: center;

    text-shadow:
        2px 2px 3px #000000,
        0 0 6px rgba(228,195,90,0.35);

    overflow: hidden;
}


/* INVISIBLE MEASURING COPY */

.measure {
    position: absolute;

    visibility: hidden;
    pointer-events: none;

    left: 18%;
    width: 64%;

    box-sizing: border-box;
    padding: 1%;

    font-family: "Henny Penny", fantasy;

    line-height: 1.18;
    letter-spacing: 0.05em;

    text-align: center;

    white-space: pre-wrap;
    overflow-wrap: break-word;
}


.objective-text:focus {
    background: rgba(255,255,255,0.02);
}

</style>
</head>


<body>

<div class="frame" id="frame">

<textarea
    id="objective"
    class="objective-text"
    spellcheck="true"
>I can plan and draft an essay in response to a prompt using text evidence for support.</textarea>

<div
    id="measure"
    class="measure">
</div>

</div>


<script>

const objective =
    document.getElementById("objective");

const measure =
    document.getElementById("measure");

const frame =
    document.getElementById("frame");


/* LOAD SAVED OBJECTIVE */

const savedObjective =
    localStorage.getItem("mrsColvinObjectiveText");

if (savedObjective !== null) {
    objective.value = savedObjective;
}


/*
AUTOMATIC RESPONSIVE FONT FITTING
*/

function fitObjective() {

    /*
    Maximum font size is calculated
    from the ACTUAL frame width.
    */

    const frameWidth =
        frame.getBoundingClientRect().width;

    let size =
        frameWidth * 0.065;

    /*
    Prevent ridiculous sizes at either end.
    */

    size = Math.min(size, 120);

    const minimumSize =
        Math.max(14, frameWidth * 0.025);


    measure.textContent =
        objective.value || " ";


    while (size > minimumSize) {

        measure.style.fontSize =
            size + "px";

        /*
        Match measuring box to textarea.
        */

        if (
            measure.scrollHeight <=
            objective.clientHeight
        ) {
            break;
        }

        size--;
    }


    objective.style.fontSize =
        size + "px";
}


/* SAVE + RESIZE WHILE TYPING */

objective.addEventListener(
    "input",
    function() {

        localStorage.setItem(
            "mrsColvinObjectiveText",
            objective.value
        );

        fitObjective();
    }
);


/*
THIS IS THE IMPORTANT PART:
Every time Classroomscreen changes
the widget size, recalculate everything.
*/

const resizeObserver =
    new ResizeObserver(function() {
        fitObjective();
    });

resizeObserver.observe(frame);


/* INITIAL LOAD */

window.addEventListener(
    "load",
    function() {

        document.fonts.ready.then(
            function() {
                fitObjective();
            }
        );

    }
);

</script>

</body>
</html>
