<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* THE ACTUAL ORNATE FRAME IMAGE */

.frame {
    position: relative;

    width: 100%;
    height: 100%;

    background-image: url("./Objectiveframe.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}

/* EDITABLE OBJECTIVE TEXT */

.objective-text {
    position: absolute;

    /* Keeps the text inside the navy writing area */
    left: 12%;
    right: 12%;
    top: 34%;
    bottom: 15%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 15px;
    box-sizing: border-box;

    text-align: center;

    font-family: "Henny Penny", fantasy;
    font-size: clamp(22px, 3.2vw, 48px);
    line-height: 1.4;
    letter-spacing: 1px;

    color: #e4c35a;

    text-shadow:
        2px 2px 3px #000000,
        0 0 6px rgba(228,195,90,0.35);

    outline: none;
    cursor: text;

    overflow: hidden;
}

/* Very subtle indication when you're editing */

.objective-text:focus {
    background: rgba(255,255,255,0.02);
}

</style>
</head>

<body>

<div class="frame">

    <div
        id="objective"
        class="objective-text"
        contenteditable="true"
        spellcheck="true"
    >I can plan and draft an essay in response to a prompt using text evidence for support.</div>

</div>


<script>

const objective = document.getElementById("objective");

/* Retrieve the objective you previously typed */

const savedObjective =
    localStorage.getItem("mrsColvinObjective");

if (savedObjective) {
    objective.innerHTML = savedObjective;
}

/* Automatically save as you type */

objective.addEventListener("input", function() {

    localStorage.setItem(
        "mrsColvinObjective",
        objective.innerHTML
    );

});

</script>

</body>
</html>
