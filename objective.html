<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

.frame {
    position: relative;
    width: 100%;
    height: 100%;

    background-image: url("./Objectiveframe.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}

.objective-text {
    position: absolute;

    left: 19%;
    width: 62%;

    top: 37%;
    height: 40%;

    box-sizing: border-box;
    padding: 8px 12px;

    border: none;
    outline: none;
    resize: none;
    background: transparent;

    font-family: "Henny Penny", fantasy;
    font-size: 56px;
    line-height: 1.35;
    letter-spacing: 1px;

    color: #e4c35a;
    text-align: center;

    text-shadow:
        2px 2px 3px #000000,
        0 0 6px rgba(228,195,90,0.35);

    overflow: hidden;
}

/* Invisible box used only to measure the text */

.measure {
    position: absolute;
    visibility: hidden;
    pointer-events: none;

    left: 19%;
    width: 62%;

    box-sizing: border-box;
    padding: 8px 12px;

    font-family: "Henny Penny", fantasy;
    font-size: 56px;
    line-height: 1.35;
    letter-spacing: 1px;

    text-align: center;
    white-space: pre-wrap;
    overflow-wrap: break-word;
}

.objective-text:focus {
    background: rgba(255,255,255,0.02);
}

</style>
</head>

<body>

<div class="frame">

    <textarea
        id="objective"
        class="objective-text"
        spellcheck="true"
    >I can plan and draft an essay in response to a prompt using text evidence for support.</textarea>

    <div id="measure" class="measure"></div>

</div>


<script>

const objective = document.getElementById("objective");
const measure = document.getElementById("measure");

const savedObjective =
    localStorage.getItem("mrsColvinObjectiveText");

if (savedObjective !== null) {
    objective.value = savedObjective;
}


function fitObjective() {

    /* START BIG */
    let size = 56;

    const minimumSize = 22;

    measure.textContent = objective.value + "\n";

    while (size >= minimumSize) {

        measure.style.fontSize = size + "px";

        /*
        Available height of the visible writing area
        */
        const availableHeight =
            objective.clientHeight;

        /*
        If our invisible copy fits,
        this is the largest usable size.
        */
        if (measure.scrollHeight <= availableHeight) {
            break;
        }

        size--;
    }

    objective.style.fontSize = size + "px";
}


objective.addEventListener("input", function() {

    localStorage.setItem(
        "mrsColvinObjectiveText",
        objective.value
    );

    fitObjective();

});


window.addEventListener("resize", fitObjective);


window.addEventListener("load", function() {

    document.fonts.ready.then(function() {
        fitObjective();
    });

});

</script>

</body>
</html>
