<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

<style>

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* GOLD HOGWARTS-STYLE FRAME */

.frame {
  width: 92%;
  height: 78%;
  box-sizing: border-box;

  background:
    radial-gradient(circle at center, #10245a 0%, #071536 70%, #030b1c 100%);

  border: 12px ridge #b88a28;

  outline: 4px solid #705014;

  box-shadow:
    0 0 0 5px #d3ad4b,
    0 0 0 9px #6d4b12,
    0 8px 20px rgba(0,0,0,.65),
    inset 0 0 30px rgba(0,0,0,.8);

  position: relative;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 25px 40px;
}

/* DECORATIVE CORNERS */

.frame::before {
  content: "✦  ⚡  ✦";
  position: absolute;
  top: 8px;

  color: #d6b94c;
  font-size: 20px;
  letter-spacing: 8px;
}

.frame::after {
  content: "✦  ⚡  ✦";
  position: absolute;
  bottom: 8px;

  color: #d6b94c;
  font-size: 20px;
  letter-spacing: 8px;
}

/* OBJECTIVE HEADING */

.heading {
  font-family: "Henny Penny", fantasy;
  color: #d6b94c;

  font-size: 34px;
  letter-spacing: 3px;

  margin-bottom: 12px;

  text-shadow:
    2px 2px 3px #000,
    0 0 7px rgba(214,185,76,.35);
}

/* EDITABLE OBJECTIVE */

.objective {
  width: 90%;

  font-family: "Henny Penny", fantasy;
  color: #e1c45c;

  font-size: 28px;
  line-height: 1.4;
  text-align: center;

  outline: none;

  text-shadow:
    2px 2px 3px #000;

  cursor: text;
}

.objective:focus {
  background: rgba(255,255,255,.03);
}

</style>
</head>


<body>

<div class="frame">

  <div class="heading">
    ✦ OBJECTIVE ✦
  </div>

  <div
    id="objective"
    class="objective"
    contenteditable="true"
    spellcheck="true">

    I can plan and draft an essay in response to a prompt using text evidence for support.

  </div>

</div>


<script>

/* LOAD SAVED OBJECTIVE */

const objective = document.getElementById("objective");

const savedObjective =
  localStorage.getItem("classObjective");

if (savedObjective) {
  objective.innerHTML = savedObjective;
}


/* SAVE WHEN YOU TYPE */

objective.addEventListener("input", function() {

  localStorage.setItem(
    "classObjective",
    objective.innerHTML
  );

});

</script>

</body>
</html>
