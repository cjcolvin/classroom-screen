<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

.frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;

    background-image: url("Objectiveframe.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
}

/* EDITABLE TEXT INSIDE THE BLUE AREA */

.objective-text {
    position: absolute;

    left: 12%;
    right: 12%;
    top: 35%;
    bottom: 14%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    font-family: "Henny Penny", fantasy;
    font-size: clamp(22px, 3.2vw, 48px);
    line-height: 1.4;
    letter-spacing: 1px;

    color: #e4c35a;

    text-shadow:
        2px 2px 2px #000,
        0 0 5px rgba(228,195,90,.35);

    outline: none;
    cursor: text;

    overflow: hidden;
    box-sizing: border-box;
    padding: 10px;
}

.objective-text:focus {
    background: rgba(255,255,255,.025);
}

</style>
</head>


<body>

<div class="frame">

    <div
        id="objective"
        class="objective-text"
        contenteditable="true"
        spellcheck="true"
    >I can plan and draft an essay in response to a prompt using text evidence for support.</div>

</div>


<script>

const objective = document.getElementById("objective");

/* LOAD YOUR SAVED OBJECTIVE */

const saved =
    localStorage.getItem("mrsColvinObjective");

if (saved) {
    objective.innerHTML = saved;
}


/* SAVE YOUR OBJECTIVE AS YOU TYPE */

objective.addEventListener("input", function () {

    localStorage.setItem(
        "mrsColvinObjective",
        objective.innerHTML
    );

});

</script>

</body>
</html>
